# EXP-002 full baseline = EXP-001 C3 (selected by the pre-registered rule): RL Zoo tuned PPO hyperparameters for Humanoid-v4 (rl-baselines3-zoo hyperparams/ppo.yml),
# applied unchanged to Humanoid-v5. `normalize: true` in RL Zoo = VecNormalize defaults with gamma = algo gamma.
experiment: EXP-002
condition: C3_zoo
env_id: Humanoid-v5
total_timesteps: 10000000
n_envs: 1
normalize:
  norm_obs: true
  norm_reward: true
  gamma: 0.95
ppo:
  learning_rate: 3.56987e-05
  lr_schedule: constant
  n_steps: 512
  batch_size: 256
  n_epochs: 5
  gamma: 0.95
  gae_lambda: 0.9
  clip_range: 0.3
  ent_coef: 0.00238306
  vf_coef: 0.431892
  max_grad_norm: 2.0
policy_kwargs:
  log_std_init: -2
  ortho_init: false
  activation_fn: relu
  net_arch:
    pi: [256, 256]
    vf: [256, 256]
eval:
  freq: 25000
  n_episodes: 10
  seed_offset: 10000
  final_episodes: 50
  final_seed_offset: 20000
checkpoints: [1000000, 2000000, 3000000, 4000000, 5000000, 6000000, 7000000, 8000000, 9000000]

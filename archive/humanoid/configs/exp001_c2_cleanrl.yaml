# EXP-001 C2 — SB3 PPO with hyperparameters matched to CleanRL ppo_continuous_action.py
# (1 env, obs+reward normalization with clip 10, linear LR annealing).
# Remaining implementation differences vs CleanRL: no value-loss clipping, SB3 value-loss scaling.
experiment: EXP-001
condition: C2_cleanrl
env_id: Humanoid-v5
total_timesteps: 3000000
n_envs: 1
normalize:
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0
  clip_reward: 10.0
  gamma: 0.99
ppo:
  learning_rate: 3.0e-4
  lr_schedule: linear
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
policy_kwargs: {}            # SB3 default: separate 64x64 tanh MLPs, orthogonal init, log_std 0 (same as CleanRL)
eval:
  freq: 25000
  n_episodes: 10
  seed_offset: 10000
  final_episodes: 50
  final_seed_offset: 20000
checkpoints: [1000000, 2000000]

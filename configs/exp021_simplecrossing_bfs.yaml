# EXP-021 (see documentation/stages/10_view_shaping_experiment.md): MiniGrid-SimpleCrossingS9N1-v0, 5x5 view.
# PBRS with the path-length (BFS, geodesic) potential Phi = -b/B.
# Everything else is identical to EXP-012 (RL Zoo minigrid-defaults, budget, evaluation), and the shaping
# section is identical to EXP-020, so EXP-021 against EXP-020 isolates the view size under shaping.
experiment: EXP-021
condition: SimpleCrossingS9N1_view5_bfs
env_id: MiniGrid-SimpleCrossingS9N1-v0
env_kwargs: {agent_view_size: 5}
wrappers: [minigrid.wrappers.FlatObsWrapper]
total_timesteps: 3000000
n_envs: 8
normalize:
  norm_obs: true
  norm_reward: true
  gamma: 0.99
ppo:
  learning_rate: 2.5e-4
  lr_schedule: constant
  n_steps: 128
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
policy_kwargs: {}
eval:
  freq: 20000
  n_episodes: 20
  seed_offset: 10000
  final_episodes: 100
  final_seed_offset: 20000
  deterministic: false
checkpoints: [1000000, 2000000]
shaping: {potential: bfs}

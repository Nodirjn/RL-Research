# EXP-020 (see documentation/stages/08_shaping_experiment.md): MiniGrid-LavaCrossingS9N1-v0, 7x7 view.
# Extension: PBRS with the shifted potential Phi = 1 - d/D.
# Everything else is identical to EXP-011 (RL Zoo minigrid-defaults, budget, evaluation).
experiment: EXP-020
condition: LavaCrossingS9N1_shifted
env_id: MiniGrid-LavaCrossingS9N1-v0
wrappers: [minigrid.wrappers.FlatObsWrapper]
total_timesteps: 3000000
n_envs: 8
normalize:
  norm_obs: true
  norm_reward: true
  gamma: 0.99
ppo:
  learning_rate: 2.5e-4
  lr_schedule: constant
  n_steps: 128
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
policy_kwargs: {}
eval:
  freq: 20000
  n_episodes: 20
  seed_offset: 10000
  final_episodes: 100
  final_seed_offset: 20000
  deterministic: false
checkpoints: [1000000, 2000000]
shaping: {potential: euclidean, offset: 1.0}

# EXP-010 pilot: PPO on MiniGrid-LavaCrossingS9N1-v0 with the original sparse reward (no shaping).
# Hyperparameters = RL Zoo minigrid-defaults (rl-baselines3-zoo hyperparams/ppo.yml, entry
# MiniGrid-Empty-Random-5x5-v0 &minigrid-defaults), including its FlatObsWrapper (7x7x3 egocentric
# view + one-hot mission text) and normalize: true (VecNormalize defaults, gamma = algo gamma).
experiment: EXP-010
condition: LavaCrossingS9N1_zoo
env_id: MiniGrid-LavaCrossingS9N1-v0
wrappers: [minigrid.wrappers.FlatObsWrapper]
total_timesteps: 1000000
n_envs: 8
normalize:
  norm_obs: true
  norm_reward: true
  gamma: 0.99
ppo:
  learning_rate: 2.5e-4
  lr_schedule: constant
  n_steps: 128
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
policy_kwargs: {}
eval:
  freq: 10000
  n_episodes: 20
  seed_offset: 10000
  final_episodes: 100
  final_seed_offset: 20000
  deterministic: true
checkpoints: []
